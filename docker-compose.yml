# Sobe o ambiente inteiro (API existente + frontend) com um unico
# `docker compose up`. Portas, URL da API e caminho do banco sao
# configuraveis por variaveis de ambiente (ver .env.example).

services:
  backend:
    build:
      context: ./api
      # dockerfile: ../docker/api.Dockerfile
    environment:
      - PORT=3000
      - DATABASE_URL=file:/data/db/dev.db # SQLite (bind-mount em ./data/db)
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./api:/app # codigo da API montado p/ hot reload (dev)
      - /app/node_modules # preserva as deps instaladas na imagem
      - /app/src/generated # preserva o Prisma Client gerado no build
      - ./data/db:/data/db # SQLite persistido no host (./data/db)
      - ./data/uploads:/data/uploads # uploads de fotos no host (./data/uploads)
    # Override do CMD da imagem: aplica o schema e sobe o server em watch mode.
    # node --watch reinicia o processo ao salvar qualquer arquivo do api/.
    command: sh -c "npx prisma db push --accept-data-loss && node --watch src/server.js"
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
    environment:
      - PORT=5173
      # Caminho que o BROWSER usa (same-origin); o dev server faz proxy.
      - VITE_API_URL=${VITE_API_URL:-/api}
      # Alvo do proxy (server-side), pelo nome do servico na rede Docker.
      - API_PROXY_TARGET=http://backend:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app # codigo montado p/ hot reload (dev)
      - /app/node_modules # preserva node_modules do container
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
